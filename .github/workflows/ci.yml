name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            clang-format \
            clang-tidy \
            cmake \
            libbpf-dev \
            libelf-dev \
            llvm \
            ninja-build \
            pkg-config \
            zlib1g-dev

      - name: Check formatting
        run: ./scripts/check-format.sh

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci
